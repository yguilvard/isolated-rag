services:
  postgres:
    image: pgvector/pgvector:pg17
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    restart: unless-stopped

  ollama-llama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_LLAMA_PORT:-11435}:11434"
    volumes:
      - ./data/ollama-llama:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: >
      /bin/ollama serve &
      until /bin/ollama list >/dev/null 2>&1; do sleep 1; done &&
      /bin/ollama pull llama3.2 &&
      wait
    restart: unless-stopped

  ollama-mistral:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_MISTRAL_PORT:-11436}:11434"
    volumes:
      - ./data/ollama-mistral:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: >
      /bin/ollama serve &
      until /bin/ollama list >/dev/null 2>&1; do sleep 1; done &&
      /bin/ollama pull mistral &&
      wait
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: [pgadmin]
    env_file: .env
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
